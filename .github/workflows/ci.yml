name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The tests/ suite is deliberately offline: chunking uses an injected fake
      # tokenizer, the off-topic guard mocks its LLM call, and metrics are pure
      # functions. So CI installs only these light deps (no torch / chromadb),
      # keeping the job fast (~30s instead of minutes installing the ML stack).
      - name: Install test + lint deps
        run: pip install pytest ruff tiktoken openai python-dotenv

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
